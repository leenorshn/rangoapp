mutation CreateStore($input: CreateStoreInput!) {
  createStore(input: $input) {
    id
    name
    address
    phone
    companyId
    company {
      id
      name
      address
      phone
      email
      description
      type
      logo
      rccm
      idNat
      idCommerce
      createdAt
      updatedAt
    }
    createdAt
    updatedAt
  }
}



