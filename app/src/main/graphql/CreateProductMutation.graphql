mutation CreateProduct($input: CreateProductInput!) {
  createProduct(input: $input) {
    id
    name
    mark
    priceVente
    priceAchat
    stock
    storeId
    store {
      id
      name
      address
      phone
      companyId
      createdAt
      updatedAt
    }
    createdAt
    updatedAt
  }
}



