query CaisseTransactions($storeId: String, $currency: String, $period: String, $limit: Int) {
  caisseTransactions(storeId: $storeId, currency: $currency, period: $period, limit: $limit) {
    id
    amount
    operation
    description
    currency
    storeId
    store {
      id
      name
      address
      phone
      companyId
      createdAt
      updatedAt
    }
    date
    createdAt
    updatedAt
  }
}



