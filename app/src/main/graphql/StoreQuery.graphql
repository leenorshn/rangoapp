query Store($id: ID!) {
  store(id: $id) {
    id
    name
    address
    phone
    companyId
    company {
      id
      name
      address
      phone
      email
      description
      type
      logo
      rccm
      idNat
      idCommerce
      createdAt
      updatedAt
    }
    createdAt
    updatedAt
  }
}



