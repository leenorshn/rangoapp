mutation CreateRapportStore($input: CreateRapportStoreInput!) {
  createRapportStore(input: $input) {
    id
    type
    product {
      id
      name
      mark
      priceVente
      priceAchat
      stock
      storeId
      createdAt
      updatedAt
    }
    quantity
    date
    storeId
    store {
      id
      name
      address
      phone
      companyId
      createdAt
      updatedAt
    }
    createdAt
    updatedAt
  }
}



