mutation CreateCaisseTransaction($input: CreateCaisseTransactionInput!) {
  createCaisseTransaction(input: $input) {
    id
    amount
    operation
    description
    currency
    storeId
    store {
      id
      name
      address
      phone
      companyId
      createdAt
      updatedAt
    }
    date
    createdAt
    updatedAt
  }
}



